<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffbf4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>💩 Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #fffbf4;
      --card: #ffffff;
      --card2: #fef9f0;
      --accent: #f97316;
      --accent2: #fbbf24;
      --text: #1c1917;
      --subtext: #a8a29e;
      --border: #e7e5e4;
      --radius: 20px;
      --shadow: 0 2px 12px rgba(0,0,0,0.07);
      --shadow-lg: 0 4px 24px rgba(0,0,0,0.10);
    }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; max-width: 480px; margin: 0 auto; }

    /* Tab bar */
    .tab-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #fff; border-top: 1px solid var(--border); display: flex; z-index: 100; padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -2px 12px rgba(0,0,0,0.05); }
    .tab-btn { flex: 1; padding: 12px 8px; background: none; border: none; color: var(--subtext); font-size: 0.72rem; font-weight: 600; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: color 0.15s; }
    .tab-icon { font-size: 1.4rem; line-height: 1; }
    .tab-btn.active { color: var(--accent); }

    /* Content */
    .content { padding: 0 20px calc(88px + env(safe-area-inset-bottom)) 20px; }

    /* Home */
    .home-header { padding: 56px 0 32px; text-align: center; }
    .home-emoji { font-size: 5rem; line-height: 1; margin-bottom: 12px; filter: drop-shadow(0 4px 8px rgba(249,115,22,0.25)); }
    .home-title { font-size: 2.2rem; font-weight: 900; letter-spacing: -1px; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .home-sub { color: var(--subtext); font-size: 0.9rem; margin-top: 6px; }
    .btn-log { width: 100%; padding: 18px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-weight: 800; font-size: 1.1rem; border: none; border-radius: var(--radius); cursor: pointer; font-family: inherit; box-shadow: 0 4px 16px rgba(249,115,22,0.35); transition: transform 0.1s, box-shadow 0.1s; touch-action: manipulation; margin-top: 8px; }
    .btn-log:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(249,115,22,0.25); }

    /* Flow */
    .flow-wrap { padding-top: 32px; }
    .flow-progress { display: flex; gap: 6px; margin-bottom: 40px; }
    .flow-seg { flex: 1; height: 6px; border-radius: 3px; background: var(--border); transition: background 0.3s; }
    .flow-seg.done { background: linear-gradient(90deg, var(--accent), var(--accent2)); }

    .flow-step-emoji { font-size: 2.8rem; margin-bottom: 10px; line-height: 1; }
    .flow-question { font-size: 1.7rem; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 6px; }
    .flow-sub { color: var(--subtext); font-size: 0.9rem; margin-bottom: 36px; }

    /* Slider */
    .slider-wrap { margin-bottom: 36px; }
    .slider-display { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; }
    .slider-bubble { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 900; color: #fff; box-shadow: 0 4px 16px rgba(249,115,22,0.35); margin-bottom: 8px; }
    .slider-lbl { font-size: 1rem; font-weight: 700; color: var(--text); min-height: 22px; }
    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 4px; outline: none; cursor: pointer; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 32px; height: 32px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); cursor: pointer; box-shadow: 0 2px 10px rgba(249,115,22,0.4); transition: transform 0.1s; }
    input[type=range]::-webkit-slider-thumb:active { transform: scale(1.15); }
    input[type=range]::-moz-range-thumb { width: 32px; height: 32px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); cursor: pointer; box-shadow: 0 2px 10px rgba(249,115,22,0.4); }
    .slider-ends { display: flex; justify-content: space-between; margin-top: 10px; }
    .slider-end { font-size: 0.75rem; color: var(--subtext); font-weight: 500; }

    /* Color picker */
    .color-grid { display: flex; gap: 8px; justify-content: space-between; margin-bottom: 36px; }
    .color-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .color-btn { width: 100%; aspect-ratio: 1; border-radius: 50%; border: 4px solid transparent; cursor: pointer; transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s; touch-action: manipulation; box-shadow: var(--shadow); }
    .color-btn.selected { border-color: var(--accent); transform: scale(1.12); box-shadow: 0 0 0 3px rgba(249,115,22,0.25), var(--shadow-lg); }
    .color-btn:active { transform: scale(0.9); }
    .color-name { font-size: 0.68rem; color: var(--subtext); text-align: center; font-weight: 600; }

    /* Buttons */
    .btn-next { width: 100%; padding: 17px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-weight: 800; font-size: 1.05rem; border: none; border-radius: var(--radius); cursor: pointer; font-family: inherit; box-shadow: 0 4px 16px rgba(249,115,22,0.30); transition: transform 0.1s, box-shadow 0.1s; touch-action: manipulation; }
    .btn-next:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; }
    .btn-next:not(:disabled):active { transform: scale(0.98); box-shadow: 0 2px 8px rgba(249,115,22,0.2); }
    .btn-ghost { width: 100%; padding: 14px; background: none; color: var(--subtext); font-size: 0.9rem; font-weight: 600; border: none; cursor: pointer; font-family: inherit; margin-top: 8px; }

    /* History */
    .history-header { padding: 44px 0 20px; display: flex; align-items: baseline; gap: 10px; }
    .history-title { font-size: 1.5rem; font-weight: 900; letter-spacing: -0.5px; }
    .history-count { font-size: 0.85rem; color: var(--subtext); font-weight: 600; }
    .history-empty { text-align: center; padding: 60px 20px; color: var(--subtext); }
    .history-empty-emoji { font-size: 3.5rem; margin-bottom: 12px; }
    .history-empty-text { font-size: 0.95rem; line-height: 1.5; }

    .entry-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; box-shadow: var(--shadow); }
    .entry-time { font-size: 0.78rem; color: var(--subtext); margin-bottom: 12px; font-weight: 600; }
    .entry-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .entry-stat { background: var(--card2); border-radius: 12px; padding: 10px 4px; text-align: center; border: 1px solid var(--border); }
    .stat-label { font-size: 0.56rem; color: var(--subtext); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 6px; font-weight: 700; }
    .stat-value { font-size: 0.78rem; font-weight: 800; color: var(--text); line-height: 1.2; }
    .color-dot { width: 20px; height: 20px; border-radius: 50%; margin: 0 auto; border: 2px solid rgba(0,0,0,0.08); }

    /* Loading */
    .loading { text-align: center; padding: 80px 20px; color: var(--subtext); font-size: 0.9rem; }
  </style>
</head>
<body>
<div class="content" id="app"></div>
<nav class="tab-bar">
  <button class="tab-btn" data-tab="log"><span class="tab-icon">💩</span><span>Log</span></button>
  <button class="tab-btn" data-tab="history"><span class="tab-icon">📋</span><span>History</span></button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://ttsyliyybgpitgdgiiwt.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_55wYPcYPTxP_7DIF4REbGQ_EBFfYmHt';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const CONSISTENCY = { 1:'Watery', 2:'Loose', 3:'Smooth', 4:'Firm', 5:'Hard' };
  const EASE        = { 1:'Easy',   2:'Mild',  3:'Moderate', 4:'Tough', 5:'Difficult' };
  const SIZE        = { 1:'Tiny',   2:'Small', 3:'Medium',   4:'Large', 5:'Huge' };
  const COLORS = [
    { id:'brown',  label:'Brown',  hex:'#7B3F00' },
    { id:'yellow', label:'Yellow', hex:'#F5C518' },
    { id:'black',  label:'Black',  hex:'#3a3a3a' },
    { id:'red',    label:'Red',    hex:'#DC143C' },
    { id:'green',  label:'Green',  hex:'#2E7D32' },
  ];
  const STEPS = ['consistency','color','ease','size'];
  const STEP_EMOJI = { consistency:'💧', color:'🎨', ease:'😌', size:'📏' };

  const s = { tab:'log', entries:[], loading:true, flow:null };

  function colorHex(id) { return COLORS.find(c=>c.id===id)?.hex||'#888'; }

  function fmtDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}) +
      ' · ' + d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  }

  function sliderBg(val) {
    const pct = (val - 1) / 4 * 100;
    return `linear-gradient(to right, #f97316 ${pct}%, #e7e5e4 ${pct}%)`;
  }

  /* ── Render ── */

  function htmlLogTab() {
    if (s.loading) return `<div class="loading">Loading…</div>`;
    if (!s.flow) return `
      <div class="home-header">
        <div class="home-emoji">💩</div>
        <div class="home-title">Poop Tracker</div>
        <div class="home-sub">Know your gut 🌿</div>
      </div>
      <button class="btn-log" id="start-log">+ Log Entry</button>`;
    return htmlFlow();
  }

  function htmlFlow() {
    const { step } = s.flow;
    const name = STEPS[step];
    const segs = STEPS.map((_,i) => `<div class="flow-seg${i<=step?' done':''}"></div>`).join('');
    let body = '';

    if (name === 'consistency') {
      const v = s.flow.consistency;
      body = `
        <div class="flow-step-emoji">${STEP_EMOJI.consistency}</div>
        <div class="flow-question">Consistency</div>
        <div class="flow-sub">What was the texture like?</div>
        <div class="slider-wrap">
          <div class="slider-display">
            <div class="slider-bubble" id="sl-c-val">${v}</div>
            <div class="slider-lbl" id="sl-c-lbl">${CONSISTENCY[v]}</div>
          </div>
          <input type="range" min="1" max="5" value="${v}" id="sl-c" style="background:${sliderBg(v)}">
          <div class="slider-ends"><span class="slider-end">Watery</span><span class="slider-end">Hard</span></div>
        </div>`;
    } else if (name === 'color') {
      const sel = s.flow.color;
      body = `
        <div class="flow-step-emoji">${STEP_EMOJI.color}</div>
        <div class="flow-question">Color</div>
        <div class="flow-sub">Pick the closest match</div>
        <div class="color-grid">
          ${COLORS.map(c=>`
            <div class="color-item">
              <button class="color-btn${sel===c.id?' selected':''}" data-color="${c.id}" style="background:${c.hex}"></button>
              <span class="color-name">${c.label}</span>
            </div>`).join('')}
        </div>`;
    } else if (name === 'ease') {
      const v = s.flow.ease;
      body = `
        <div class="flow-step-emoji">${STEP_EMOJI.ease}</div>
        <div class="flow-question">Ease</div>
        <div class="flow-sub">How much effort did it take?</div>
        <div class="slider-wrap">
          <div class="slider-display">
            <div class="slider-bubble" id="sl-e-val">${v}</div>
            <div class="slider-lbl" id="sl-e-lbl">${EASE[v]}</div>
          </div>
          <input type="range" min="1" max="5" value="${v}" id="sl-e" style="background:${sliderBg(v)}">
          <div class="slider-ends"><span class="slider-end">Easy</span><span class="slider-end">Difficult</span></div>
        </div>`;
    } else if (name === 'size') {
      const v = s.flow.size;
      body = `
        <div class="flow-step-emoji">${STEP_EMOJI.size}</div>
        <div class="flow-question">Size</div>
        <div class="flow-sub">Estimate the volume</div>
        <div class="slider-wrap">
          <div class="slider-display">
            <div class="slider-bubble" id="sl-s-val">${v}</div>
            <div class="slider-lbl" id="sl-s-lbl">${SIZE[v]}</div>
          </div>
          <input type="range" min="1" max="5" value="${v}" id="sl-s" style="background:${sliderBg(v)}">
          <div class="slider-ends"><span class="slider-end">Tiny</span><span class="slider-end">Huge</span></div>
        </div>`;
    }

    const isLast = step === STEPS.length - 1;
    return `
      <div class="flow-wrap">
        <div class="flow-progress">${segs}</div>
        ${body}
        <button class="btn-next" id="btn-next">${isLast ? 'Save Entry 💾' : 'Next →'}</button>
        <button class="btn-ghost" id="btn-back">${step > 0 ? '← Back' : 'Cancel'}</button>
      </div>`;
  }

  function htmlHistoryTab() {
    if (s.loading) return `<div class="loading">Loading…</div>`;
    const sorted = s.entries.slice().sort((a,b)=>b.recorded_at.localeCompare(a.recorded_at));
    if (!sorted.length) return `
      <div class="history-header"><span class="history-title">History</span></div>
      <div class="history-empty">
        <div class="history-empty-emoji">🔍</div>
        <div class="history-empty-text">No entries yet.<br>Log your first one!</div>
      </div>`;
    return `
      <div class="history-header">
        <span class="history-title">History</span>
        <span class="history-count">${sorted.length} entr${sorted.length===1?'y':'ies'}</span>
      </div>
      ${sorted.map(e=>`
        <div class="entry-card">
          <div class="entry-time">${fmtDate(e.recorded_at)}</div>
          <div class="entry-stats">
            <div class="entry-stat"><div class="stat-label">Consistency</div><div class="stat-value">${CONSISTENCY[e.consistency]}</div></div>
            <div class="entry-stat"><div class="stat-label">Color</div><div class="stat-value"><div class="color-dot" style="background:${colorHex(e.color)}"></div></div></div>
            <div class="entry-stat"><div class="stat-label">Ease</div><div class="stat-value">${EASE[e.ease]}</div></div>
            <div class="entry-stat"><div class="stat-label">Size</div><div class="stat-value">${SIZE[e.size]}</div></div>
          </div>
        </div>`).join('')}`;
  }

  function render() {
    document.getElementById('app').innerHTML =
      s.tab === 'log' ? htmlLogTab() : htmlHistoryTab();
    document.querySelectorAll('.tab-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.tab === s.tab));
    bind();
  }

  /* ── Bind ── */

  function bindSlider(id, key, labels, valId, lblId) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('input', () => {
      s.flow[key] = parseInt(el.value);
      const vEl = document.getElementById(valId);
      const lEl = document.getElementById(lblId);
      if (vEl) vEl.textContent = s.flow[key];
      if (lEl) lEl.textContent = labels[s.flow[key]];
      el.style.background = sliderBg(s.flow[key]);
    });
  }

  function bind() {
    document.querySelectorAll('.tab-btn').forEach(b =>
      b.addEventListener('click', () => { s.tab = b.dataset.tab; render(); }));

    document.getElementById('start-log')?.addEventListener('click', () => {
      s.flow = { step:0, consistency:3, color:'brown', ease:3, size:3 };
      render();
    });

    document.getElementById('btn-back')?.addEventListener('click', () => {
      if (s.flow.step > 0) { s.flow.step--; render(); }
      else { s.flow = null; render(); }
    });

    bindSlider('sl-c', 'consistency', CONSISTENCY, 'sl-c-val', 'sl-c-lbl');
    bindSlider('sl-e', 'ease',        EASE,        'sl-e-val', 'sl-e-lbl');
    bindSlider('sl-s', 'size',        SIZE,        'sl-s-val', 'sl-s-lbl');

    document.querySelectorAll('[data-color]').forEach(b => b.addEventListener('click', () => {
      s.flow.color = b.dataset.color;
      document.querySelectorAll('[data-color]').forEach(x =>
        x.classList.toggle('selected', x.dataset.color === s.flow.color));
    }));

    document.getElementById('btn-next')?.addEventListener('click', () => {
      if (!s.flow) return;
      if (s.flow.step < STEPS.length - 1) { s.flow.step++; render(); }
      else saveEntry();
    });
  }

  /* ── Data ── */

  async function saveEntry() {
    const entry = {
      id: Date.now().toString(),
      recorded_at: new Date().toISOString(),
      consistency: s.flow.consistency,
      color: s.flow.color,
      ease: s.flow.ease,
      size: s.flow.size,
    };
    s.entries.push(entry);
    s.flow = null;
    s.tab = 'history';
    render();
    await db.from('poop_entries').insert(entry);
  }

  async function loadData() {
    const { data } = await db.from('poop_entries').select('*').order('recorded_at', { ascending: false });
    if (data) s.entries = data;
    s.loading = false;
    render();
  }

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  render();
  loadData();
</script>
</body>
</html>
